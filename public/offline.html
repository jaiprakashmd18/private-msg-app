<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<title>Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #121218; color: #ececf1;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 320px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: #a3a3b5; margin: 0 0 20px; }
  button { background: #8b93ff; color: #14141c; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Check your internet connection. Your messages are safe and will load when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
