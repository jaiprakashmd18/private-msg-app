<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #000; color: #f2f2f7;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  main { max-width: 320px; text-align: center; }
  .icon { width: 64px; height: 64px; margin: 0 auto; border-radius: 16px; background: #0a84ff; display: grid; place-items: center; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: #98989f; margin: 0 0 24px; }
  button { background: #0a84ff; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font: inherit; font-weight: 600; }
  button:active { opacity: .8; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.7 6.7L5 22l4.6-2.4c.8.2 1.6.2 2.4.2 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>Check your internet connection. Your messages are safe and will load when you're back online.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  var APP_URL = "https://loveline.space/chat";
  function retry() { location.replace(APP_URL); }
  document.getElementById("retry").addEventListener("click", retry);
  // Come back automatically when the connection returns.
  window.addEventListener("online", retry);
</script>
</body>
</html>
