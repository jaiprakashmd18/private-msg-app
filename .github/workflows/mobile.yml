name: Mobile apps

# Builds the Ghostline Android and iOS apps (Capacitor) on GitHub's machines.
# The website and its Vercel deployment are not affected by this workflow.
#
# Android: always builds an installable test APK. With the signing secrets
#          below it also builds the signed AAB for Google Play.
#            ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#            ANDROID_KEYSTORE_PASSWORD
#            ANDROID_KEY_ALIAS
#            ANDROID_KEY_PASSWORD
#            ANDROID_GOOGLE_SERVICES_JSON_BASE64  (optional) base64 of google-services.json
# iOS:     compiles the app without signing, to prove the Xcode project builds.
#          Signing and the App Store upload happen in Xcode on a Mac.
#
# See docs/MOBILE_PUBLISHING.md.

on:
  push:
    branches: [mobile-app]
    paths: ["android/**", "ios/**", "mobile/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["android/**", "ios/**", "mobile/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android

      - name: Add Firebase config (if provided)
        env:
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        if: ${{ env.GOOGLE_SERVICES != '' }}
        run: echo "$GOOGLE_SERVICES" | base64 --decode > android/app/google-services.json

      - name: Add upload key (if provided)
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release AAB
        working-directory: android
        env:
          GHOSTLINE_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          GHOSTLINE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GHOSTLINE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GHOSTLINE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$GHOSTLINE_KEYSTORE_FILE" ] || unset GHOSTLINE_KEYSTORE_FILE
          ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ghostline-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (unsigned build)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iPhone (no signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build for the iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
